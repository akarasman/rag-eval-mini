experiment: scifact-baselines

dataset:
  name: scifact
  data_dir: data
  split: test

retriever:
  name: hybrid
  params:
    fusion: rrf
    fusion_params: {rrf_k: 60}
    candidates_per_retriever: 100
    components:
      - name: bm25
        params: {k1: 1.5, b: 0.75, stem: false}
      - name: dense
        params:
          model_name: sentence-transformers/all-MiniLM-L6-v2
          store: exact

metrics:
  names: [recall, mrr, ndcg]
  ks: [1, 5, 10, 100]

mlflow:
  run_name: hybrid rrf bm25 + minilm
  examples:
    n: 10
    metric: ndcg@10
