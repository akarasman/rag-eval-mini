experiment: scifact-baselines

dataset:
  name: scifact
  data_dir: data
  split: test

retriever:
  name: hybrid
  params:
    fusion: rrf
    fusion_params: {rrf_k: 60}
    candidates_per_retriever: 100
    components:
      - name: dense
        params:
          model_name: sentence-transformers/all-MiniLM-L6-v2
          store: exact
      - name: dense
        params:
          model_name: BAAI/bge-small-en-v1.5
          query_prefix: "Represent this sentence for searching relevant passages: "
          store: exact

metrics:
  names: [recall, mrr, ndcg]
  ks: [1, 5, 10, 100]

mlflow:
  run_name: hybrid rrf minilm + bge-small
  examples:
    n: 10
    metric: ndcg@10
