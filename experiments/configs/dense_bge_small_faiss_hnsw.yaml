experiment: scifact-baselines

dataset:
  name: scifact
  data_dir: data
  split: test

retriever:
  name: dense
  params:
    model_name: BAAI/bge-small-en-v1.5
    query_prefix: "Represent this sentence for searching relevant passages: "
    store: faiss
    store_params: {index_type: hnsw, hnsw_m: 32, ef_search: 64}

metrics:
  names: [recall, mrr, ndcg]
  ks: [1, 5, 10, 100]

mlflow:
  run_name: dense bge-small-en-v1.5 + faiss hnsw
  examples:
    n: 10
    metric: ndcg@10
